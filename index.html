<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Rental Card</title>

</head>
<body>

  <div class="rental-card">
    <div class="card-image"></div>

    <div class="badge">
      <span class="badge-icon"></span>
      For Rental
    </div>

    <div class="price">
      <span class="coin">$</span>
      3,000
    </div>
    <div class="type">Apartment</div>

    <p class="address">
      86872 Jacob Gateway,<br>
      Durganport, WV 48044
    </p>

    <div class="features">
      <span class="item bed">4</span>
      <span class="item bath">2</span>
      <span class="item area">180 m2</span>
      <span class="item pet"></span>
    </div>

    <div class="card-bar"></div>
  </div>

</body>
</html>
